<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talált Tárgyak Nyilvántartása</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-app">

    <header class="navbar-custom shadow-sm sticky-top">
        <div class="container-fluid px-3">
            <div class="d-flex align-items-center justify-content-between mb-2 mb-lg-0">
                <div class="d-flex align-items-center">
                    <div class="logo-icon-container me-2 me-md-3">
                        <i class="bi bi-box-seam text-white"></i>
                    </div>
                    <div class="header-text-group text-white">
                        <h1 class="h6 mb-0 fw-bold">Talált Tárgyak Nyilvántartása</h1>
                        <div class="small opacity-75 d-none d-sm-block">Lost & Found System</div>
                    </div>
                </div>
                
                <div class="admin-profile text-end">
                    <div class="text-white small fw-bold">Adminisztrátor</div>
                    <span class="badge badge-admin text-uppercase">Adminisztrátor</span>
                </div>
            </div>
            
            <div class="nav-buttons-container mt-2">
                <button class="btn btn-nav-custom"><i class="bi bi-box-arrow-up me-1"></i> Kiadott</button>
                <button class="btn btn-nav-custom"><i class="bi bi-geo-alt me-1"></i> Helyszínek</button>
                <button class="btn btn-nav-custom"><i class="bi bi-people me-1"></i> Felhasználók</button>
                <button class="btn btn-nav-custom ms-auto"><i class="bi bi-box-arrow-right me-1"></i> Kijelentkezés</button>
            </div>
        </div>
    </header>

    <main class="container-fluid p-3 p-md-4">
        <section class="card border-0 shadow-sm rounded-3 mb-4">
            <div class="card-body p-3 p-md-4">
                <h6 class="fw-bold mb-3"><i class="bi bi-search me-2"></i> Keresés</h6>
                <form id="filterForm" class="row g-2 g-md-3">
                    <div class="col-12 col-sm-6 col-lg-2">
                        <label class="form-label-custom">Helyszín</label>
                        <input type="text" class="form-control custom-input" placeholder="Helyszín...">
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label-custom">Dátumtól</label>
                        <input type="date" class="form-control custom-input">
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label-custom">Dátumig</label>
                        <input type="date" class="form-control custom-input">
                    </div>
                    <div class="col-12 col-sm-6 col-lg-2">
                        <label class="form-label-custom">Megnevezés</label>
                        <input type="text" class="form-control custom-input" placeholder="Tárgy...">
                    </div>
                    <div class="col-12 col-lg-4 d-flex align-items-end">
                        <button type="button" class="btn btn-action-primary w-100">Keresés indítása</button>
                    </div>
                </form>
            </div>
        </section>

        <div class="d-flex overflow-x-auto gap-2 mb-3 pb-2">
            <span class="infopill pill-active border-primary">Aktív: 5 db</span>
            <span class="infopill pill-storable">Raktározható: 3 db</span>
            <span class="infopill pill-warehouse">Raktárban: 2 db</span>
            <span class="infopill pill-total">Összes: 7 db</span>
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 mb-4">
            <div class="btn-group-custom w-100 w-md-auto">
                <button class="tab-btn active w-50 w-md-auto">Aktív (5)</button>
                <button class="tab-btn w-50 w-md-auto">Raktár (2)</button>
            </div>
            <button class="btn btn-action-primary w-100 w-md-auto py-2" id="btnAddNew">
                <i class="bi bi-plus-lg me-1"></i> Új tárgy rögzítése
            </button>
        </div>

        <div id="listContainer" class="row g-3">
            </div>
    </main>

    <div class="modal fade" id="generalModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content border-0">
                <div class="modal-header border-0 p-4 pb-0">
                    <div>
                        <h5 class="modal-title fw-bold">Cím</h5>
                        <p class="modal-subtitle text-secondary small mb-0"></p>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4"></div>
                <div class="modal-footer border-top p-3">
                    <button type="button" class="btn btn-cancel" data-bs-dismiss="modal">Mégse</button>
                    <button type="button" class="btn btn-action-primary px-4" id="modalSaveBtn">Rögzítés</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
