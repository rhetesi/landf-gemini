<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talált Tárgyak Nyilvántartása</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-app">

    <header class="navbar-custom p-3 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="text-white">
                <h1 class="h5 mb-0 fw-bold">Talált Tárgyak Nyilvántartása</h1>
                <small class="opacity-75">Lost & Found Management System</small>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="text-end text-white d-none d-md-block">
                    <div class="small fw-bold">Adminisztrátor</div>
                    <span class="badge badge-admin">Adminisztrátor</span>
                </div>
                <button class="btn btn-nav-custom px-4 py-2" id="btnAddNew">
                    <i class="bi bi-plus-lg me-2"></i>Új tárgy rögzítése
                </button>
            </div>
        </div>
    </header>

    <main class="container-fluid p-4">
        <div id="main-content" class="row g-4 text-center py-5">
            <div class="col-12">
                <i class="bi bi-box-seam display-1 text-muted opacity-25"></i>
                <h3 class="text-muted mt-3">Nincs találat</h3>
                <p class="text-secondary">Még nincs rögzített tárgy a rendszerben.</p>
            </div>
        </div>
    </main>

    <div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0">
                <div class="modal-header border-0 p-4 pb-0">
                    <h5 class="modal-title fw-bold fs-4">Új talált tárgy rögzítése</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <p class="px-4 text-secondary small mb-0">Adja meg a talált tárgy adatait az alábbi űrlapon.</p>
                
                <div class="modal-body p-4">
                    </div>
                
                <div class="modal-footer p-3 px-4">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Mégse</button>
                    <button type="button" class="btn btn-primary px-4" style="background-color: var(--primary-blue);" id="saveBtn">Rögzítés</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
