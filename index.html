<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talált Tárgyak Nyilvántartása</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-app">

    <header class="navbar-custom shadow-sm">
        <div class="container-fluid px-4 d-flex align-items-center justify-content-between py-2">
            <div class="d-flex align-items-center">
                <div class="logo-icon-container me-3">
                    <i class="bi bi-box-seam text-white fs-3"></i>
                </div>
                <div class="header-text-group">
                    <h1 class="h5 mb-0 fw-bold text-white">Talált Tárgyak Nyilvántartása</h1>
                    <div class="small text-white-50">Lost & Found Management System</div>
                </div>
            </div>
            
            <div class="d-flex align-items-center gap-2">
                <div class="admin-profile d-none d-lg-block me-3 text-end">
                    <div class="text-white small"><i class="bi bi-person-circle me-1"></i> Adminisztrátor</div>
                    <span class="badge badge-admin">Adminisztrátor</span>
                </div>
                <button class="btn btn-nav-custom"><i class="bi bi-box-arrow-up me-1"></i> Kiadott</button>
                <button class="btn btn-nav-custom"><i class="bi bi-geo-alt me-1"></i> Helyszínek</button>
                <button class="btn btn-nav-custom"><i class="bi bi-people me-1"></i> Felhasználók</button>
                <button class="btn btn-nav-custom ms-2"><i class="bi bi-box-arrow-right me-1"></i> Kijelentkezés</button>
            </div>
        </div>
    </header>

    <main class="container-fluid p-4">
        <section class="card border-0 shadow-sm rounded-3 mb-4">
            <div class="card-body p-4">
                <h6 class="fw-bold mb-4 d-flex align-items-center text-dark">
                    <i class="bi bi-search me-2"></i> Keresés és szűrés
                </h6>
                <form id="filterForm" class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label-custom">Helyszín</label>
                        <input type="text" class="form-control custom-input" placeholder="pl. Főépület">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label-custom">Dátumtól</label>
                        <input type="text" class="form-control custom-input" placeholder="éééé. hh. nn.">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label-custom">Dátumig</label>
                        <input type="text" class="form-control custom-input" placeholder="éééé. hh. nn.">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label-custom">Megnevezés</label>
                        <input type="text" class="form-control custom-input" placeholder="pl. Kulcs">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label-custom">Leírás/tulajdonság</label>
                        <input type="text" class="form-control custom-input" placeholder="pl. fekete, bőr">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label-custom">Rögzítő</label>
                        <select class="form-select custom-input">
                            <option selected>Mind</option>
                        </select>
                    </div>
                </form>
            </div>
        </section>

        <div class="d-flex gap-2 mb-4 flex-wrap">
            <span class="infopill pill-active">Aktív: 0 db</span>
            <span class="infopill pill-storable">Raktározható: 0 db</span>
            <span class="infopill pill-warehouse">Raktárban: 0 db</span>
            <span class="infopill pill-total">Összes: 0 db</span>
        </div>

        <section class="card border-0 shadow-sm rounded-3 overflow-hidden">
            <div class="card-header bg-white border-0 p-3 d-flex flex-wrap justify-content-between align-items-center">
                <div class="btn-group-custom">
                    <button class="tab-btn active" id="tabActive"><i class="bi bi-box me-1"></i> Aktív (0)</button>
                    <button class="tab-btn" id="tabWarehouse"><i class="bi bi-journal-text me-1"></i> Raktár (0)</button>
                </div>
                
                <div class="d-flex align-items-center gap-3 mt-2 mt-md-0">
                    <div class="view-switch">
                        <button class="v-btn active"><i class="bi bi-grid-fill"></i></button>
                        <button class="v-btn"><i class="bi bi-list-ul"></i></button>
                    </div>
                    <div class="form-check form-switch mb-0 d-flex align-items-center gap-2">
                        <input class="form-check-input" type="checkbox" id="showAll">
                        <label class="form-check-label small text-secondary fw-medium" for="showAll">Összes megjelenítése</label>
                    </div>
                    <button class="btn btn-action-primary" id="btnAddNew">
                        <i class="bi bi-plus-lg me-1"></i> Új tárgy rögzítése
                    </button>
                </div>
            </div>

            <div class="card-body py-5 text-center">
                <div class="empty-state py-5">
                    <i class="bi bi-box-seam display-1 text-light-emphasis d-block mb-3"></i>
                    <p class="text-secondary fs-5">Nincs találat</p>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
