<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talált Tárgyak Nyilvántartása</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-app">

    <header class="navbar-custom shadow-sm sticky-top">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="logo-container me-3">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <div class="text-white">
                        <h1 class="h6 mb-0 fw-bold">Talált Tárgyak Nyilvántartása</h1>
                        <div class="small opacity-75 d-none d-md-block">Lost & Found Management System</div>
                    </div>
                </div>
                
                <div class="admin-profile text-end text-white">
                    <div class="small fw-bold">Adminisztrátor</div>
                    <span class="badge badge-admin">Adminisztrátor</span>
                </div>
            </div>
            
            <nav class="nav-scroll mt-3">
                <button class="btn btn-nav-custom"><i class="bi bi-box-arrow-up me-1"></i> Kiadott</button>
                <button class="btn btn-nav-custom"><i class="bi bi-geo-alt me-1"></i> Helyszínek</button>
                <button class="btn btn-nav-custom"><i class="bi bi-people me-1"></i> Felhasználók</button>
                <button class="btn btn-nav-custom ms-md-auto"><i class="bi bi-box-arrow-right me-1"></i> Kijelentkezés</button>
            </nav>
        </div>
    </header>

    <main class="container-fluid p-3 p-md-4">
        <section class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <h6 class="fw-bold mb-3 text-secondary"><i class="bi bi-search me-2"></i> KERESÉS ÉS SZŰRÉS</h6>
                <form class="row g-3">
                    <div class="col-md-3">
                        <label class="small fw-bold text-muted mb-1">Helyszín</label>
                        <input type="text" class="form-control custom-input" placeholder="pl. Főépület">
                    </div>
                    <div class="col-md-3">
                        <label class="small fw-bold text-muted mb-1">Megnevezés</label>
                        <input type="text" class="form-control custom-input" placeholder="pl. Kulcscsomó">
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <button type="button" class="btn btn-action-primary w-100 w-md-auto">Keresés</button>
                    </div>
                </form>
            </div>
        </section>

        <div class="d-flex flex-wrap gap-2 mb-4">
            <span class="infopill pill-active">Aktív: 5 db</span>
            <span class="infopill pill-storable">Raktározható: 3 db</span>
            <span class="infopill pill-warehouse">Raktárban: 2 db</span>
            <span class="infopill pill-total">Összes: 10 db</span>
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div class="btn-group shadow-sm bg-white rounded-3 overflow-hidden">
                <button class="btn btn-light border-end px-4 active">Aktív</button>
                <button class="btn btn-light px-4">Raktár</button>
            </div>
            <button class="btn btn-action-primary" id="btnAddNew">
                <i class="bi bi-plus-lg me-1"></i> Új tárgy rögzítése
            </button>
        </div>
    </main>

    <div class="modal fade" id="generalModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 p-4 pb-0">
                    <div>
                        <h5 class="modal-title fw-bold">Cím</h5>
                        <p class="modal-subtitle text-secondary small mb-0"></p>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4"></div>
                <div class="modal-footer border-top p-3">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Mégse</button>
                    <button type="button" class="btn btn-action-primary px-4" id="modalSave">Rögzítés</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
